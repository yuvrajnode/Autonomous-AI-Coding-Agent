name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check agent server evals tests
      - run: mypy agent

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # No API key here on purpose: the suite runs against the scripted client,
      # so a green build never depends on the provider being up.
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aca
          POSTGRES_PASSWORD: aca
          POSTGRES_DB: aca
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aca -d aca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pgvector round trip
        env:
          ACA_DATABASE_URL: postgresql://aca:aca@localhost:5433/aca
          ACA_EMBEDDING_PROVIDER: hashing
          ACA_EMBEDDING_DIM: "256"
        run: pytest -q tests/test_pgvector.py

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # --scripted exercises the harness and the graders, not the model. The
      # real suite is run by hand against a live key; see docs/evals.md.
      - run: python -m evals.runner --suite evals/tasks/core.yaml --scripted || true
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_reports/
          if-no-files-found: ignore
